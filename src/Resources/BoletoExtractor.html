<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator de Boletos - WPF Integration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';
    </script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .loader {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body class="bg-gray-50 p-4">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Upload do Boleto</h2>

            <div class="mb-4">
                <input type="file" id="boletoFile" accept="image/png, image/jpeg, application/pdf"
                       class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <div id="loader" class="hidden loader"></div>
            <div id="status" class="text-sm text-gray-600 mt-2">Selecione um arquivo de boleto...</div>

            <canvas id="pdfCanvas" style="display: none;"></canvas>
        </div>
    </div>

    <script>
        const API_KEY = "AIzaSyDE-arZPG2EgGJRGSZtz4-k0o7KF4bfNTw";
        const OCR_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;
        const JSON_STRUCTURE_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;

        document.getElementById('boletoFile').addEventListener('change', handleFileSelect);

        function enviarStatus(message) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(JSON.stringify({
                    type: "status",
                    message: message
                }));
            }
            document.getElementById('status').textContent = message;
        }

        function enviarDados(dados) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(JSON.stringify({
                    type: "dadosExtraidos",
                    dados: dados
                }));
            }
        }

        // Função para processar arquivo recebido do C#
        function processarArquivoAutomatico(fileData, fileName) {
            document.getElementById('loader').classList.remove('hidden');
            enviarStatus(`Processando arquivo automático: ${fileName}...`);

            try {
                // Converter base64 para File
                const file = base64ToFile(fileData, fileName);

                // Atualizar a UI para mostrar o arquivo selecionado
                if (window.DataTransfer && file) {
                    try {
                        const dataTransfer = new DataTransfer();
                        dataTransfer.items.add(file);
                        document.getElementById('boletoFile').files = dataTransfer.files;
                    } catch (e) {
                        console.error("Erro ao atualizar campo de arquivo:", e);
                    }
                }

                // Processar o arquivo
                processarArquivo(file);
            } catch (error) {
                enviarStatus(`Erro ao processar arquivo automático: ${error.message}`);
                document.getElementById('loader').classList.add('hidden');
            }
        }

        // Converter base64 para File
        function base64ToFile(base64Data, fileName) {
            try {
                // Se base64Data já inclui o prefixo data:, extrair apenas os dados
                let mime = 'application/octet-stream';
                let base64 = base64Data;

                if (base64Data.includes('data:')) {
                    const parts = base64Data.split(',');
                    mime = parts[0].match(/:(.*?);/)[1];
                    base64 = parts[1];
                }

                // Determinar o tipo de arquivo com base na extensão
                if (fileName.toLowerCase().endsWith('.pdf')) {
                    mime = 'application/pdf';
                } else if (fileName.toLowerCase().endsWith('.png')) {
                    mime = 'image/png';
                } else if (fileName.toLowerCase().endsWith('.jpg') || fileName.toLowerCase().endsWith('.jpeg')) {
                    mime = 'image/jpeg';
                }

                // Converter base64 para array de bytes
                const byteCharacters = atob(base64);
                const byteArrays = [];

                for (let offset = 0; offset < byteCharacters.length; offset += 512) {
                    const slice = byteCharacters.slice(offset, offset + 512);

                    const byteNumbers = new Array(slice.length);
                    for (let i = 0; i < slice.length; i++) {
                        byteNumbers[i] = slice.charCodeAt(i);
                    }

                    const byteArray = new Uint8Array(byteNumbers);
                    byteArrays.push(byteArray);
                }

                // Criar Blob e depois File
                const blob = new Blob(byteArrays, { type: mime });
                return new File([blob], fileName, { type: mime });
            } catch (error) {
                console.error("Erro ao converter base64:", error);
                enviarStatus(`Erro na conversão do arquivo: ${error.message}`);
                return null;
            }
        }

        // Função central de processamento de arquivo
        async function processarArquivo(file) {
            if (!file) return;

            document.getElementById('loader').classList.remove('hidden');
            enviarStatus('Processando arquivo...');

            let combinedExtractedText = "";

            try {
                if (file.type === 'application/pdf') {
                    enviarStatus('Processando PDF...');
                    combinedExtractedText = await processPdfPagesAsImages(file);
                } else if (['image/png', 'image/jpeg'].includes(file.type)) {
                    enviarStatus('Processando imagem...');
                    const base64ImageData = await convertFileToBase64(file);
                    combinedExtractedText = await extractTextFromImageAPI(base64ImageData);
                } else {
                    throw new Error(`Tipo de arquivo não suportado: ${file.type}`);
                }

                if (!combinedExtractedText) {
                    throw new Error("Não foi possível extrair texto do arquivo");
                }

                enviarStatus('Estruturando dados...');
                const structuredJson = await structureTextToJson(combinedExtractedText);

                if (structuredJson) {
                    enviarDados(structuredJson);
                    enviarStatus('Dados extraídos com sucesso!');
                } else {
                    throw new Error("Falha ao estruturar dados");
                }
            } catch (error) {
                enviarStatus(`Erro: ${error.message}`);
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        }

        // Handler para seleção manual de arquivo
        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                await processarArquivo(file);
            }
        }

        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function processPdfPagesAsImages(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let allExtractedText = "";

            // Container para os canvas
            const canvasContainer = document.createElement('div');
            canvasContainer.style.display = 'none';
            document.body.appendChild(canvasContainer);

            try {
                // Processa até 3 páginas
                for (let pageNum = 1; pageNum <= Math.min(pdf.numPages, 3); pageNum++) {
                    enviarStatus(`Processando página ${pageNum}...`);

                    // Cria um novo canvas para cada página
                    const canvas = document.createElement('canvas');
                    canvasContainer.appendChild(canvas);
                    const context = canvas.getContext('2d');

                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 2.0 });

                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    // Renderiza a página no canvas recém-criado
                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    const imageData = canvas.toDataURL('image/png').split(',')[1];
                    const extractedText = await extractTextFromImageAPI(imageData);

                    if (extractedText) {
                        allExtractedText += extractedText + " ";
                    }

                    // Limpa o canvas após o uso
                    canvas.width = 0;
                    canvas.height = 0;
                    canvasContainer.removeChild(canvas);
                }
            } finally {
                // Limpa todos os canvas criados
                document.body.removeChild(canvasContainer);
            }

            return allExtractedText.trim();
        }

        async function extractTextFromImageAPI(base64ImageData) {
            const prompt = `
                        Analise esta imagem de boleto bancário e extraia EXATAMENTE as seguintes informações:

                        - Beneficiário/Cedente (nome da empresa que irá receber)
                        - CNPJ do Beneficiário
                        - CNPJ do Pagador/Cedente
                        - Pagador/Sacado (quem deve pagar)
                        - Valor do boleto
                        - Data de vencimento
                        - Linha digitável
                        - Nosso número
                        - Agência e código do beneficiário
                        - Estado do beneficiário
                        - CEP do beneficiário

                        Retorne apenas o texto extraído, sem explicações.
                        `;

            const requestBody = {
                contents: [{
                    parts: [
                        { text: prompt },
                        {
                            inline_data: {
                                mime_type: "image/png",
                                data: base64ImageData
                            }
                        }
                    ]
                }]
            };

            const response = await fetch(OCR_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                throw new Error(`Erro na API de OCR: ${response.status}`);
            }

            const data = await response.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        }

        async function structureTextToJson(extractedText) {
            const prompt = `
                        Transforme o seguinte texto extrapido de um boleto em um JSON estruturado.
                        Use EXATAMENTE estas chaves, mesmo que alguns valores sejam null:

                        {
                            "beneficiario": "nome do beneficiário",
                            "cnpjBeneficiario": "CNPJ beneficiario formatado",
                            "cnpjPagador": "CNPJ pagador formatado",
                            "cepBeneficiario": "CEP",
                            "estadoBeneficiario": "Estado",
                            "pagador": "nome do pagador",
                            "valor": "valor em formato brasileiro",
                            "vencimento": "data no formato dd/MM/yyyy",
                            "linhaDigitavel": "linha digitável completa",
                            "nossoNumero": "nosso número",
                            "agenciaCodigoBeneficiario": "agência e código"
                        }

                        Texto a processar:
                        ${extractedText}

                        Retorne APENAS o JSON, sem explicações ou formatação markdown.
                        `;

            const requestBody = {
                contents: [{
                    parts: [{ text: prompt }]
                }]
            };

            const response = await fetch(JSON_STRUCTURE_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                throw new Error(`Erro na API de estruturação: ${response.status}`);
            }

            const data = await response.json();
            const jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";

            try {
                return JSON.parse(jsonText.replace(/```json\n?|\n?```/g, ''));
            } catch {
                throw new Error("Falha ao parsear JSON da resposta");
            }
        }

        // Escuta comandos do WPF
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', function (e) {
                const command = JSON.parse(e.data);
                if (command.action === 'limpar') {
                    document.getElementById('boletoFile').value = '';
                    enviarStatus('Pronto para novo arquivo');
                }
                else if (command.action === 'processarArquivo' && command.fileData) {
                    // Processar arquivo enviado pelo WPF
                    processarArquivoAutomatico(command.fileData, command.fileName || 'arquivo.pdf');
                }
            });
        }
    </script>
</body>
</html>
